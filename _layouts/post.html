---
layout: default
---

<section class="{{ page.type }} style1 orient-right content-align-left image-position-center onscroll-image-fade-in">
    <div class="content">
        <h1>{{ page.title }}</h1>
        <p class="major">{{ page.description }}</p>
    </div>
    <div class="image">
        <img src="{{ site.baseurl }}/{{ page.image }}" alt="" />
    </div>
</section>

<section class="wrapper style1 align-center">
  <div class="inner">
    {{ content }}
  </div>
</section>
