- years: "1893-96"
  name: "Noach Alfred Svensson"
  role: "Mjölnare/Kvarnägare"
  quote: |
    <b>Auktion.</b>
    Genom offentlig auktion, som på stället förrättas tisdagen den 25 augusti kl.12 p. d. kommer, jämlikt borgenärernas beslut i kvarnägaren N.A. Stehns konkurs, att till högstbjudande försäljas konkursboet tillhöriga Ås Väderkvarn, belägen i Ås socken i mäldrik trakt strax vid Åsbro gästgifvaregård och Derome järnvägsstation. Innehåller 4 par stenar, däraf 2 par sammälds-, ett par topp- och ett par finsikt -samt skalverk. Till kvarnen, som är taxerad till 6,000kr., hörer ett boningshus af trä, innehållande 3 rum samt kök och förstuga, jämte nödiga uthusbyggnader och smedja, murade af gråsten.
    Betalnings- och öfriga villkor blifva före auktionens början tillkännagifna, och kunna spekulanter dessförinnan härom erhålla underrättelse af undertecknande, sysslomän i konkursen. Samma dag kl. 3 e. m. kommer jämväl att försäljas all lösegendom i konkursboet, bestående af: möbler och husgerådssaker, sängkläder och linne m.m. samt 40 st. höns. 
    Åsbro & Bossgården den 13 aug. 1896.
    Joh:s Börjesson J.Nilssson.
    <br />Varbergsposten - 1896-08-14 & 1896-08-18 
