- title: "Stormen 1905"
  date: "1905"
  type: "story"
  content: |
    År 1905 drabbades kvarnen av en svår storm som slet av en av kvarnens vingar. Detta var en dramatisk påminnelse om naturens krafter och de risker som följde med att driva en väderkvarn. Skadan blev omfattande och visade hur utsatt kvarnen var för väderets makter.

- title: "Fotogenmotorn – Ett banbrytande experiment"
  date: "1913"
  type: "archive"
  source: "Göteborgs handels- och sjöfartstidning - 1913-03-12"
  content: |
    <b>Väderkvarn som drifves med fotogenmotor.</b> Ett mycket lyckat experiment med fotogenmotor som drifkraft för väderkvarn har gjorts af ägaren till Åhs kvarn i Derome i näreten af Varberg. På förslag af Varbergs mek. verkstad lät ägaren af kvarnen, Gustaf Svensson, på försök i kvarnen insätta en vid värkstaden tillvärkad 20 hlt. fotogenmotor. Resultatet har öfverträffat alla förvätningar och kvarnens produktionsförmåga beräknas nu blifva minst tre gånger så stor som förut, pr år räknat.
    
    När kvarnen förut allenast var häänvisad till vindkraften beräknades den kunna hållas i gång omkring 6, högst 7 månader. Nu möter inga hinder för värksamhet året rundt. Motorn fungerar utmärkt och ägaren är synnerligen belåten med experimentets lyckliga resultat. Synnerligast som motorkraften äfven har visat sig vara mycket fördelatig ur ekonomisk synpunkt.
    
    Vid anställda prof har man sålunda med två stenar och en sekt förmalt icke mindre än 60 säckar, lika med 6,000 kg. på 11 timmar. Helt säkert komma nu en hel del af de halländska väderkvarnägarna att skaffa sig fotogenmotorer för att oberoende af vind kunna hålla sina kvarna i gång året rundt.

- title: "Konkursauktionen 1896"
  date: "1896-08-14"
  type: "archive"
  source: "Varbergsposten - 1896-08-14 & 1896-08-18"
  content: |
    <b>Auktion.</b> Genom offentlig auktion, som på stället förrättas tisdagen den 25 augusti kl.12 p. d. kommer, jämlikt borgenärernas beslut i kvarnägaren N.A. Stehns konkurs, att till högstbjudande försäljas konkursboet tillhöriga Ås Väderkvarn, belägen i Ås socken i mäldrik trakt strax vid Åsbro gästgifvaregård och Derome järnvägsstation.
    
    Innehåller 4 par stenar, däraf 2 par sammälds-, ett par topp- och ett par finsikt -samt skalverk. Till kvarnen, som är taxerad till 6,000kr., hörer ett boningshus af trä, innehållande 3 rum samt kök och förstuga, jämte nödiga uthusbyggnader och smedja, murade af gråsten.
    
    Betalnings- och öfriga villkor blifva före auktionens början tillkännagifna, och kunna spekulanter dessförinnan härom erhålla underrättelse af undertecknande, sysslomän i konkursen. Samma dag kl. 3 e. m. kommer jämväl att försäljas all lösegendom i konkursboet, bestående af: möbler och husgerådssaker, sängkläder och linne m.m. samt 40 st. höns.
    
    Åsbro & Bossgården den 13 aug. 1896. Joh:s Börjesson J.Nilssson.

- title: "Elektrifieringen 1923"
  date: "1920-1923"
  type: "story"
  content: |
    Efter framgången med fotogenmotorn fortsatte moderniseringen. År 1920 installerades en kraftfull råoljemotor av märket Gullbrandssens vid östra väggen i bottenvåningen. Denna motor var ännu mer pålitlig och effektiv än fotogenmotorn.
    
    Den slutliga tekniska revolutionen kom 1923 när kvarnen elektrifierades. Nu kunde kvarnen drivas med elektricitet, vilket gjorde verksamheten ännu mer oberoende av väder och andra osäkerhetsfaktorer. Detta gjorde Ås väderkvarn till en av de första i Halland att ta detta moderna steg.

- title: "Sista vingen försvinner 1954"
  date: "1954"
  type: "story"
  content: |
    År 1954 togs den sista av kvarnens vingar ned. Detta markerade slutet på en era – vindkraften som en gång varit kvarnens enda drivkraft var nu inte längre nödvändig. Kvarnen hade fullständigt övergått till modern motordrift.

- title: "Kvarnens sista malning 1965"
  date: "1965"
  type: "story"
  content: |
    År 1965 togs kvarnen ur bruk efter över 100 år av kontinuerlig verksamhet. Den hade tjänat lokalsamhället väl genom flera generationer, från den tid när vindkraften var det enda alternativet till den moderna motoriseringens era.
