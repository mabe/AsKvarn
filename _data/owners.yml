- period: "Före 1865"
  name: "Okänd"
  description: "Kvarnen flyttades från Stafsinge till nuvarande plats på 1860-talet på uppdrag av gästgivaren vid Åsbro gästgivaregård."

- period: "1870-1896"
  name: "Carl Andersson"
  description: "Gästgivare vid Åsbro. Mördades brutalt 1870 vid ett torgbråk."

- period: "1875-1896"
  name: "Anna Severina Andersson"
  description: "Arrenderade ut gästgiveriet och kvarnen efter Carl Anderssons död."

- period: "1896-1900"
  name: "Johannes Börjeson & J. Nilsson"
  description: "Köpte kvarnen vid konkursauktion 1896. Auktionen annonserades i Varbergsposten."

- period: "1906-1908"
  name: "Karl Bernhard Andersson & Anders Johan Bengtsson"
  description: "Köpte kvarnen 1906 med mark och hus."

- period: "1908-nutid"
  name: "Gustav Svensson och ättlingar"
  description: "Gustav Ludvig Svensson köpte kvarnen 1908. Han installerade fotogenmotor 1913, råoljemotor 1920 och elektrifierade kvarnen 1923. Kvarnen ägs fortfarande av hans ättlingar."

- period: "1912-2012"
  name: "Hembyggsföreningen (förvaltning)"
  description: "Hembyggsföreningen hade ansvar för underhållet under en period, men kvarnen återgick 2012 till familjen."
